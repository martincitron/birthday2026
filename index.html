<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Martinův wishlist</title>

<style>
:root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --primary: #2563eb;
    --text: #1f2937;
    --muted: #6b7280;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 40px 20px;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 40px;
}

.wishlist {
    display: grid;
    gap: 24px;
}

.item {
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    transition: transform .2s ease;
}

.item:hover {
    transform: translateY(-3px);
}

.item-image {
    width: 100%;
    height: 260px;
    object-fit: contain;
    background: white;
    padding: 15px;
}

.content {
    padding: 20px;
}

.title {
    font-size: 1.3rem;
    font-weight: 600;
}

.description {
    margin-top: 10px;
    color: var(--muted);
}

.meta {
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
}

.price {
    color: var(--primary);
    font-weight: 600;
}

.priority {
    color: #f59e0b;
}

.link {
    display: inline-block;
    margin-top: 15px;
    background: var(--primary);
    color: white;
    text-decoration: none;
    padding: 10px 14px;
    border-radius: 8px;
}

.link:hover {
    background: #1d4ed8;
}

footer {
    text-align: center;
    margin-top: 50px;
    color: var(--muted);
}
</style>

</head>
<body>

<div class="container">

<h1>🎁 Martinův wishlist</h1>

<p class="subtitle">
Tipy na dárky k narozeninám, Vánocům nebo jiné příležitosti.
</p>

<div class="wishlist">

    <div class="item">
        <img class="item-image" src="https://www.weber.com/CZ/cs/accessories/cisteni-a-udrzba/" alt="Weber olej">
        <div class="content">
            <div class="title">Weber olej ve spreji</div>
            <div class="description">
                Olej na přípravu grilu a planchy.
            </div>
            <div class="meta">
                <span class="price">cca 300 Kč</span>
                <span class="priority">⭐⭐⭐</span>
            </div>
        </div>
    </div>

    <div class="item">
        <img class="item-image"
             src="https://www.ikea.com/cz/cs/images/products/styrspel-herni-zidle-tmave-seda-seda__1103062_pe867380_s5.jpg"
             alt="IKEA STYRSPEL">
        <div class="content">
            <div class="title">IKEA STYRSPEL</div>
            <div class="description">
                Herní židle, tmavě šedá.
            </div>
            <div class="meta">
                <span class="price">4 990 Kč</span>
                <span class="priority">⭐⭐
